<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raise Them Ready - Complete Your Enrollment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

  :root {

    --ink:#1A1A1A; --body:#55534E; --bg:#FFFFFF; --bg-alt:#F3EEF1;

    --navy:#4A2340; --navy-hover:#351930; --berry:#9B2F52; --berry-tint:#F9EEF2; --border:#E9E7E2;

    --green:#00bf63; --green-dark:#00925A;

  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html { scroll-behavior:smooth; }

  body { font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; text-shadow:0 0.7px 2.1px rgba(74,35,64,0.126); }

  .container { max-width:600px; margin:0 auto; padding:0 24px; }

  .section { padding:50px 0 90px; }

  h1 { font-weight:800; font-size:32px; line-height:1.25; letter-spacing:-0.01em; margin-bottom:14px; text-align:center; }

  h3 { font-weight:700; font-size:19px; line-height:1.35; margin-bottom:12px; }

  p { color:var(--body); font-size:16px; line-height:1.7; }

  .lede { font-size:18px; line-height:1.6; text-align:center; color:var(--body); margin-bottom:44px; }



  /* Brought over from main landing page final-card block */

  .qualify-item { display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--border); }

  .qualify-item .mark { flex-shrink:0; font-weight:700; font-size:15px; width:22px; }

  .final-list { max-width:480px; margin:0 auto; text-align:left; }

  .final-list .qualify-item { border-bottom:none; padding:9px 0; }

  .final-card { background:var(--navy); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:30px 28px; margin:0 0 32px; text-align:left; text-shadow:0 1px 3px rgba(0,0,0,0.35); }

  .final-card h3 { color:#EAF0FA; font-size:17px; margin-bottom:16px; }

  .final-card .final-list .mark { color:#00bf63; }

  .final-card .final-note { border-top:1px solid rgba(255,255,255,0.15); padding-top:18px; margin:20px 0 0; font-style:italic; font-size:14px; color:#D9C0D2; max-width:none; }



  /* Pricing card */

  .pricing-card { border-radius:20px; padding:0; margin-bottom:32px; text-align:center; }

  .pricing-today-box { background:#000; border:1px solid rgba(0,191,99,0.35); border-radius:16px; padding:24px 20px; text-shadow:0 1px 3px rgba(0,0,0,0.4); }

  .pricing-today-label { font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--green); margin-bottom:8px; }

  .pricing-today-amount { font-size:30.8px; font-weight:800; color:#fff; line-height:1; margin-bottom:8px; }

  .pricing-today-note { color:#C9B4C4; font-size:13px; }



  /* Nashira note */

  .nashira-note { background:var(--berry-tint); border-radius:14px; padding:24px 26px; margin-bottom:28px; }

  .note-label { font-family:'Caveat',cursive; font-weight:700; font-size:22px; color:var(--berry); margin-bottom:8px; }

  .note-body { font-style:italic; color:var(--body); font-size:15px; line-height:1.7; }



  /* Generic content card */

  .content-card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:26px 26px; margin-bottom:24px; }

  .content-card p { margin-bottom:12px; }

  .content-card p:last-child { margin-bottom:0; }

  .green-line { color:var(--green-dark); font-weight:700; }



  /* Urgency alert */

  .urgency-alert { background:var(--berry-tint); border:1px solid rgba(155,47,82,0.25); border-radius:14px; padding:20px 22px; text-align:center; margin-bottom:24px; }

  .urgency-alert .alert-title { color:var(--berry); font-weight:700; font-size:16px; margin-bottom:6px; }

  .urgency-alert .alert-body { color:var(--berry); font-size:14px; }



  /* Step list */

  .step-item { display:flex; gap:14px; align-items:flex-start; margin-bottom:18px; }

  .step-item:last-child { margin-bottom:0; }

  .step-num { flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--navy); color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; }

  .step-num.green { background:var(--green); color:#06331d; }

  .step-item p { padding-top:3px; margin:0; font-size:15px; }



  /* Join box */

  .join-box { background:#EAF6EE; border:1px solid rgba(0,146,90,0.28); border-radius:14px; padding:24px 26px; text-align:center; margin-bottom:28px; }

  .join-box h3 { margin-bottom:8px; }

  .join-box p { margin:0; font-size:14.5px; }



  /* Quote */

  .story-quote { border-left:4px solid var(--berry); padding:4px 0 4px 20px; margin:0 0 32px; font-weight:600; font-style:italic; color:var(--ink); font-size:16px; line-height:1.6; }



  /* CTA */

  .btn { display:block; width:100%; text-align:center; background:#000; color:#fff; font-weight:700; font-size:16px; padding:20px 24px; border-radius:10px; text-decoration:none; border:none; cursor:pointer; transition:transform 0.15s ease, background 0.15s ease; letter-spacing:0.01em; }

  @media (hover:hover) { .btn:hover { background:#1a1a1a; transform:translateY(-2px); } }

  .btn-green { background:#09894b; }

  @media (hover:hover) { .btn-green:hover { background:#076e3c; } }

  .btn-glow { animation:hero-glow 2.6s ease-in-out infinite; }

  @keyframes hero-glow {

    0%, 100% { box-shadow:0 0 0 0 rgba(0,0,0,0); }

    50% { box-shadow:0 0 22px 6px rgba(0,0,0,0.3); }

  }

  @keyframes ctaZoom { 0%, 100% { transform:scale(1); } 50% { transform:scale(1.05); } }

  .cta-blink { animation:ctaZoom 1.8s ease-in-out infinite; }

  .checkout-footer { text-align:center; color:var(--body); font-size:13px; margin-top:18px; line-height:1.7; }



  @media (max-width:480px) {

    .section { padding:0 0 60px; }

    h1 { font-size:26px; }

    .pricing-today-amount { font-size:25.2px; }

  }



  @keyframes priceAppear { 0% { opacity:0; transform:scale(0.7); } 60% { opacity:1; transform:scale(1.1); } 100% { opacity:1; transform:scale(1); } }

  @keyframes strikeGrow { from { transform:scaleX(0); } to { transform:scaleX(1); } }

  @keyframes arrowBounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(10px); } }

  .price-997-wrap { position:relative; display:inline-block; opacity:0; animation:priceAppear 0.5s ease-out forwards; }

  .price-997-wrap .strike-line { position:absolute; left:0; right:0; top:52%; height:1.5px; background:#E24444; transform-origin:left center; transform:scaleX(0); animation:strikeGrow 0.3s ease-out forwards; animation-delay:0.55s; }

  .bounce-arrow { animation:arrowBounce 1.1s ease-in-out infinite; animation-delay:1s; }

</style>

</head>

<body>



<section class="section">

  <div class="container">

    <h1 style="font-family:'Caveat',cursive; font-weight:700; color:var(--berry); font-size:40px; line-height:1.3; letter-spacing:0.02em;">You showed up. &#127881; <span style="color:#000;">That already says everything about the kind of parent you are.</span></h1>

    <p class="lede"><span style="background:#EAF6EE; padding:8px 20px; border-radius:24px; display:inline-block;">The home you want for your family is one step away. Let's finish this.</span></p>
